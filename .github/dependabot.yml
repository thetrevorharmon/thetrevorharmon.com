version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      astro:
        patterns:
          - 'astro'
          - '@astrojs/*'
          - 'satteri*'
          - '@xingwangzhe/*'
          - '@xsynaptic/*'
      codemirror:
        patterns:
          - '@codemirror/*'
          - '@lezer/*'
          - '@uiw/react-codemirror'
      types:
        patterns:
          - '@types/*'
      radix-ui:
        patterns:
          - '@radix-ui/*'
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
    ignore:
      # Browser polyfills for antlr4ts (see astro.config.mjs). Pinned exactly in package.json on purpose.
      - dependency-name: 'assert'
      - dependency-name: 'util'
      - dependency-name: 'buffer'
      # Sätteri and its Astro/Mermaid plugins are pinned together (upgrade them together).
      - dependency-name: 'satteri'
      - dependency-name: '@xingwangzhe/satteri-mermaid'
      - dependency-name: '@astrojs/markdown-satteri'
      # Tailwind 4 has a new config/PostCSS model; deliberate migration only.
      - dependency-name: 'tailwindcss'
        update-types: ['version-update:semver-major']
      # Unmaintained alpha; pinned by ^0.5.0-alpha range.
      - dependency-name: 'antlr4ts'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
