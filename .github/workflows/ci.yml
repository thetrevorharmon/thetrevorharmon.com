name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn build
      # `yarn check` is a built-in yarn command, so use `yarn run`.
      - run: yarn run check
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test

      # The parity specs that only need tests/parity/baseline.json, run against
      # the build above (`yarn test:ci` starts `yarn preview` itself). The visual
      # and old-vs-new checks are not run here: they need screenshots of the old
      # Gatsby site, which are gitignored (about 520 MB). Run those locally
      # before merging (see the README).
      - run: npx playwright install --with-deps chromium
      - run: yarn test:ci

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
